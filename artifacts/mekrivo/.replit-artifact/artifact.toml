kind = "web"
previewPath = "/"
title = "MEKRIVO"
description = "A privacy-first destination-aware file readiness platform that analyzes files against upload requirements, fixes mechanical issues locally, and verifies the final result before upload."
version = "1.0.0"
id = "artifacts/mekrivo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20363

[services.development]
run = "pnpm --filter @workspace/mekrivo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mekrivo", "run", "build" ]
serve = "static"
publicDir = "artifacts/mekrivo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20363"
BASE_PATH = "/"
